name: Eklentiler ve README Yoneticisi

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'plugins.json'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
        
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bağımlılıkları Kur
        run: npm install node-fetch@2 adm-zip

      # --- 1. ADIM: .CS3 DOSYALARINI İNDİR, YEREL DEPOYU TARA, SİLİNENLERİ TEMİZLE VE JSON GÜNCELLE ---
      - name: Pluginleri Indir, Yerel Depoyu Tara ve JSON Guncelle
        run: |
          node - <<'NODE'
          const fetch = require('node-fetch');
          const fs = require('fs');
          const path = require('path');
          const AdmZip = require('adm-zip');

          const urls = [
            'https://raw.githubusercontent.com/Wiojelt/WioSinema/refs/heads/builds/plugins.json',
            'https://raw.githubusercontent.com/Wiojelt/WioSpor/refs/heads/builds/plugins.json',
            'https://raw.githubusercontent.com/Wiojelt/TurkSinema/builds/plugins.json',
            'https://raw.githubusercontent.com/Wiojelt/TurkSpor/builds/plugins.json',
            'https://raw.githubusercontent.com/manitux-app/cs-plugins/main/builds/plugins.json',
            'https://raw.githubusercontent.com/pltmustafa/plt-stream/builds/plugins.json',
            'https://raw.githubusercontent.com/patr0nq/patr0n-cs/refs/heads/builds/plugins.json',          
            'https://raw.githubusercontent.com/ctnkyaumt/cstest/refs/heads/builds/plugins.json',
            'https://raw.githubusercontent.com/patr0nq/cstestAddons/refs/heads/builds/plugins.json',
            'https://raw.githubusercontent.com/caca1403/cloudstream-cagi-eklenti/refs/heads/main/plugins.json',
            'https://raw.githubusercontent.com/marrem/cs-Kekik/builds/plugins.json',
            'https://raw.githubusercontent.com/feroxx/Kekik-cloudstream/builds/plugins.json',
            'https://raw.githubusercontent.com/aytzey/cs-kraptor/refs/heads/builds/plugins.json',
            'https://raw.githubusercontent.com/lepotane/MRC-builds/builds/plugins.json',
            'https://raw.githubusercontent.com/blackhope01/cloudstream-plugins/refs/heads/builds/plugins.json',
            'https://raw.githubusercontent.com/murattunc05/cloudstream-turkish/refs/heads/builds/plugins_stable.json'
          ];

          const selectiveUrls = [
            {
              url: 'https://raw.githubusercontent.com/GitLatte/Sinetech/builds/plugins.json',
              allowedPlugins: [
                { owner: "GitLatte", name: "KICK Türkiye - Latte" },
                { owner: "GitLatte", name: "powerboard Dizi - Latte" },
                { owner: "GitLatte", name: "powerboard Sinema - Latte" }
              ]
            },
            {
              url: 'https://raw.githubusercontent.com/CakesTwix/cloudstream-extensions-uk/refs/heads/builds/plugins.json',
              allowedPlugins: [
                { owner: "CakesTwix", name: "SyncPlugin" }
              ]
            },
            {
              url: 'https://raw.githubusercontent.com/dcenhance/dcext/main/plugins.json',
              allowedPlugins: [
                { owner: "dcenhance", name: "CS3MProvider" }
              ]
            }
          ];

          const specificBlacklist = [
            { owner: "Wiojelt", name: "00 · TurkSinema'ya destek ol ☕" },
            { owner: "Wiojelt", name: "00 · TurkSpor'a destek ol ☕" },
            { owner: "GitLatte", name: "YouTube \u00d6zel - Latte" },
            { owner: "ramazansancar", name: "GolgeTV" },
            { owner: "ramazansancar", name: "powerdizi" },
            { owner: "ramazansancar", name: "powersinema" }
          ];

          function normalizeVersion(v) {
            return String(v || '0.0.0').replace(/^v/i, '').trim();
          }

          function getStandardKey(p) {
            const raw = p.name || p.internalName || p.id || "";
            return raw.toLowerCase().replace(/\s+/g, '').replace(/i/g, 'ı').trim();
          }

          function getRepoOwner(url) {
            const match = url.match(/githubusercontent\.com\/([^/]+)/);
            return match ? match[1] : "Unknown";
          }

          function formatPluginObject(p) {
            const pName = p.name || p.internalName || "Unknown";
            const pInternal = p.internalName || pName;
            
            const ordered = {
              iconUrl: p.iconUrl !== undefined ? p.iconUrl : "",
              apiVersion: p.apiVersion !== undefined ? p.apiVersion : 1,
              repositoryUrl: p.repositoryUrl !== undefined ? p.repositoryUrl : "",
              fileSize: p.fileSize !== undefined ? p.fileSize : 0,
              status: p.status !== undefined ? p.status : 1,
              language: p.language || p.lang || "tr",
              authors: p.authors || (p.author ? [p.author] : ["Bilinmiyor"]),
              tvTypes: p.tvTypes || [],
              version: p.version !== undefined ? p.version : 1,
              internalName: pInternal,
              description: p.description || "",
              url: p.url || "",
              name: pName
            };

            for (const key of Object.keys(p)) {
              if (!(key in ordered) && key !== "downloadUrl") {
                ordered[key] = p[key];
              }
            }

            return ordered;
          }

          function extractManifestFromCs3(filePath) {
            try {
              const zip = new AdmZip(filePath);
              const zipEntries = zip.getEntries();
              
              const manifestEntry = zipEntries.find(entry => entry.entryName.endsWith('manifest.json'));
              if (manifestEntry) {
                const manifestText = zip.readAsText(manifestEntry);
                return JSON.parse(manifestText);
              }
            } catch (e) {
              console.log(`⚠️ ${filePath} için manifest.json okunamadı: ${e.message}`);
            }
            return null;
          }

          async function processPlugins(targetUrl, isSelective, allowedList, mergedMap, today) {
            try {
              const res = await fetch(targetUrl);
              if (!res.ok) return;
              const remotePlugins = await res.json();
              const repoOwner = getRepoOwner(targetUrl);

              for (const remote of remotePlugins) {
                if (Array.isArray(remote.tvTypes) && remote.tvTypes.includes('NSFW')) continue;
                
                delete remote.downloadUrl;
                if (!remote.name && remote.internalName) remote.name = remote.internalName;

                const key = getStandardKey(remote);
                const existing = mergedMap.get(key);

                const isRemoteDisabled = remote.status === 0 || remote.status === "0";
                if (isRemoteDisabled) {
                  if (existing) {
                    delete existing.downloadUrl;
                    mergedMap.set(key, formatPluginObject(existing));
                  }
                  continue;
                }

                const pluginUrl = remote.url || remote.downloadUrl || "";
                if (!pluginUrl || !pluginUrl.endsWith('.cs3')) continue;

                const pluginName = (remote.name || "").toLowerCase().trim();
                const pluginInternal = (remote.internalName || "").toLowerCase().trim();
                
                const isBlocked = specificBlacklist.some(b => 
                  b.owner.toLowerCase() === repoOwner.toLowerCase() && 
                  (b.name.toLowerCase() === pluginName || b.name.toLowerCase() === pluginInternal)
                );
                if (isBlocked) continue;

                if (isSelective) {
                  const isAllowed = allowedList.some(a => 
                    a.owner.toLowerCase() === repoOwner.toLowerCase() && 
                    (a.name.toLowerCase() === pluginName || a.name.toLowerCase() === pluginInternal)
                  );
                  if (!isAllowed) continue;
                }

                if (!remote.language && !remote.lang) remote.language = "tr";

                const ownerDir = path.join('plugins', repoOwner);
                if (!fs.existsSync(ownerDir)) {
                  fs.mkdirSync(ownerDir, { recursive: true });
                }

                const fileName = path.basename(pluginUrl);
                const localFilePath = path.join(ownerDir, fileName);
                
                let downloadedSuccessfully = false;
                let shouldAttemptDownload = true;

                if (existing && normalizeVersion(existing.version) === normalizeVersion(remote.version) && fs.existsSync(localFilePath)) {
                  shouldAttemptDownload = false;
                  downloadedSuccessfully = true;
                }

                if (shouldAttemptDownload) {
                  try {
                    const fileRes = await fetch(pluginUrl);
                    if (fileRes.ok) {
                      const buffer = await fileRes.buffer();
                      fs.writeFileSync(localFilePath, buffer);
                      downloadedSuccessfully = true;
                    }
                  } catch (err) {
                    console.error(`${fileName} indirilemedi: ${err.message}`);
                  }
                }

                const hasLocalFile = fs.existsSync(localFilePath);
                if (!downloadedSuccessfully && !hasLocalFile) {
                  continue;
                }

                const githubRepoUser = "mooncrown04";
                const githubRepoName = "depolar";
                
                remote.url = `https://raw.githubusercontent.com/${githubRepoUser}/${githubRepoName}/main/plugins/${repoOwner}/${fileName}`;
                delete remote.downloadUrl;

                if (!existing) {
                  remote.description = `🆕 ${repoOwner} ${today} ${(remote.description || '')}`;
                  mergedMap.set(key, formatPluginObject(remote));
                } else {
                  const vRemote = normalizeVersion(remote.version);
                  const vExisting = normalizeVersion(existing.version);
                  
                  if (downloadedSuccessfully && vRemote !== vExisting) {
                    let cleanDesc = (remote.description || '').replace(/^(🔴|🆕).*?\d{2}\.\d{2}\.\d{4}/g, '').trim();
                    remote.description = `🔴 ${repoOwner} ${today} ${cleanDesc}`;
                    mergedMap.set(key, formatPluginObject(remote));
                  } else {
                    delete existing.downloadUrl;
                    mergedMap.set(key, formatPluginObject(existing));
                  }
                }
              }
            } catch (e) { console.error(`${targetUrl} hatası: ${e.message}`); }
          }

          function syncLocalFilesToMap(mergedMap, today) {
            const pluginsDir = 'plugins';
            if (!fs.existsSync(pluginsDir)) return;

            const githubRepoUser = "mooncrown04";
            const githubRepoName = "depolar";
            const customOwnerName = "MoOnCrOwN DePo";

            const owners = fs.readdirSync(pluginsDir);
            for (const owner of owners) {
              const ownerPath = path.join(pluginsDir, owner);
              if (fs.statSync(ownerPath).isDirectory()) {
                const files = fs.readdirSync(ownerPath);
                for (const file of files) {
                  if (file.endsWith('.cs3')) {
                    const localFilePath = path.join(ownerPath, file);
                    const manifest = extractManifestFromCs3(localFilePath);
                    
                    const pluginNameFromFile = manifest ? (manifest.name || manifest.internalName) : path.basename(file, '.cs3');
                    const key = pluginNameFromFile.toLowerCase().replace(/\s+/g, '').replace(/i/g, 'ı').trim();
                    
                    if (!mergedMap.has(key)) {
                      const localUrl = `https://raw.githubusercontent.com/${githubRepoUser}/${githubRepoName}/main/plugins/${owner}/${file}`;
                      
                      const newLocalPlugin = {
                        iconUrl: manifest ? (manifest.iconUrl || "") : "",
                        apiVersion: manifest ? (manifest.apiVersion || 1) : 1,
                        repositoryUrl: manifest ? (manifest.repositoryUrl || "") : "",
                        fileSize: fs.statSync(localFilePath).size,
                        status: 1,
                        language: manifest ? (manifest.language || manifest.lang || "tr") : "tr",
                        authors: manifest ? (manifest.authors || [manifest.author || owner]) : [owner],
                        tvTypes: manifest ? (manifest.tvTypes || []) : [],
                        version: manifest ? normalizeVersion(manifest.version) : "1.0.0",
                        internalName: manifest ? (manifest.internalName || pluginNameFromFile) : pluginNameFromFile,
                        description: `🆕 ${customOwnerName} ${today} ${manifest && manifest.description ? manifest.description : 'Depodan yüklenen eklenti.'}`,
                        url: localUrl,
                        name: pluginNameFromFile
                      };
                      mergedMap.set(key, formatPluginObject(newLocalPlugin));
                    }
                  }
                }
              }
            }
          }

          function cleanDeletedPluginsFromMap(mergedMap) {
            for (const [key, plugin] of mergedMap.entries()) {
              const pluginUrl = plugin.url || plugin.downloadUrl || "";
              if (pluginUrl) {
                const match = pluginUrl.match(/\/main\/plugins\/([^/]+)\/([^/]+)$/);
                if (match) {
                  const owner = match[1];
                  const fileName = match[2];
                  const localPath = path.join('plugins', owner, fileName);
                  
                  if (!fs.existsSync(localPath)) {
                    mergedMap.delete(key);
                  }
                }
              }
            }
          }

          (async () => {
            const mergedMap = new Map();
            const today = new Date().toLocaleDateString('tr-TR');

            if (fs.existsSync('plugins.json')) {
              try {
                const oldContent = JSON.parse(fs.readFileSync('plugins.json', 'utf8'));
                for (const p of oldContent) {
                  delete p.downloadUrl;
                  const pName = (p.name || p.internalName || "").toLowerCase().trim();
                  const pInternal = (p.internalName || "").toLowerCase().trim();
                  const isOldBlocked = specificBlacklist.some(b => 
                    b.owner.toLowerCase() === "ramazansancar" && 
                    (b.name.toLowerCase() === pName || b.name.toLowerCase() === pInternal)
                  );
                  if (isOldBlocked) continue;
                  mergedMap.set(getStandardKey(p), formatPluginObject(p));
                }
              } catch (e) { console.log("Eski dosya okunamadı veya boş."); }
            }

            for (const url of urls) {
              await processPlugins(url, false, [], mergedMap, today);
            }

            for (const item of selectiveUrls) {
              await processPlugins(item.url, true, item.allowedPlugins, mergedMap, today);
            }

            syncLocalFilesToMap(mergedMap, today);
            cleanDeletedPluginsFromMap(mergedMap);

            const finalPluginsArray = Array.from(mergedMap.values()).map(formatPluginObject);
            fs.writeFileSync('plugins.json', JSON.stringify(finalPluginsArray, null, 2));

            const backupMap = new Map();
            if (fs.existsSync('backup-plugins.json')) {
              try {
                const oldBackupContent = JSON.parse(fs.readFileSync('backup-plugins.json', 'utf8'));
                for (const bp of oldBackupContent) {
                  delete bp.downloadUrl;
                  backupMap.set(getStandardKey(bp), formatPluginObject(bp));
                }
              } catch (e) {}
            }

            cleanDeletedPluginsFromMap(backupMap);

            for (const plugin of finalPluginsArray) {
              const clone = { ...plugin };
              delete clone.downloadUrl;
              const match = clone.description && clone.description.match(/(?:🆕|🔴)\s+([^\s]+)/);
              const owner = match ? match[1] : "Bilinmiyor";
              
              if (clone.url && clone.url.endsWith('.cs3')) {
                const fileName = path.basename(clone.url);
                const localCs3Url = `https://raw.githubusercontent.com/mooncrown04/depolar/main/plugins/${owner}/${fileName}`;
                clone.url = localCs3Url;
              }
              backupMap.set(getStandardKey(clone), formatPluginObject(clone));
            }

            const finalBackupArray = Array.from(backupMap.values()).map(formatPluginObject);
            fs.writeFileSync('backup-plugins.json', JSON.stringify(finalBackupArray, null, 2));
          })();
          NODE

      # --- 2. ADIM: INTERAKTİF README TABLO OLUŞTURUCU (HEPSİ VE KAYNAKLAR) ---
      - name: README.md Guncelle
        shell: python
        run: |
          import json, re
          from datetime import datetime, timedelta, timezone
          from collections import defaultdict
          from pathlib import Path

          OWNER = "MoOnCrOwN"
          OWNER_AVATAR = "https://st5.depositphotos.com/1041725/67731/v/380/depositphotos_677319750-stock-illustration-ararat-mountain-illustration-vector-white.jpg"
          OWNER_PROFILE = "https://github.com/mooncrown04"
          FLAGS = {"tr": "https://flagcdn.com/w20/tr.png", "en": "https://flagcdn.com/w20/gb.png", "de": "https://flagcdn.com/w20/de.png", "us": "https://flagcdn.com/w20/us.png", "hi": "https://flagcdn.com/w20/in.png"}
          
          now = datetime.now(timezone(timedelta(hours=3)))
          today_str = now.strftime("%d.%m.%Y")
          full_date = now.strftime("%d.%m.%Y %H:%M")

          if not Path("plugins.json").exists(): exit(0)
          with open("plugins.json", encoding="utf-8") as f:
              plugins = json.load(f)

          all_rows = []
          repo_groups = defaultdict(list)
          today_news_dict = defaultdict(list)
          today_updates_dict = defaultdict(list)
          new_count = 0
          updated_count = 0

          for p in sorted(plugins, key=lambda x: str(x.get('name') or x.get('internalName') or '').lower()):
              name = p.get('name') or p.get('internalName') or 'Unknown'
              desc = p.get('description', '')
              date_match = re.search(r'\d{2}\.\d{2}\.\d{4}', desc)
              date_str = date_match.group(0) if date_match else "—"
              
              owner_match = re.search(r'(?:🆕 |🔴 )(.*?) \d', desc)
              repo_name = owner_match.group(1) if owner_match else "Bilinmiyor"
              
              marker = "⚪"
              if date_match:
                  try:
                      item_date = datetime.strptime(date_str, "%d.%m.%Y").replace(tzinfo=now.tzinfo)
                      
                      if date_str == today_str:
                          if "🆕" in desc:
                              today_news_dict[repo_name].append(name)
                          elif "🔴" in desc:
                              today_updates_dict[repo_name].append(name)

                      if (now - item_date).days <= 15:
                          if "🔴" in desc: 
                              marker = "🔴"
                              updated_count += 1
                          elif "🆕" in desc: 
                              marker = "🆕"
                              new_count += 1
                  except: pass
              
              lang_val = str(p.get("language") or p.get("lang") or "tr").lower().split('-')[0]
              flag_url = FLAGS.get(lang_val, "https://flagcdn.com/w20/un.png")
              country_tag = f'<img src="{flag_url}" width="20" alt="{lang_val}">'
              icon = p.get("iconUrl") or p.get("icon") or ""
              img_tag = f'<img src="{icon}" width="30" style="border-radius:4px;">' if icon and "%size%" not in icon else "—"
              
              row_str = f"| {img_tag} | **{name}** | {date_str} | {marker} | `{repo_name}` | {country_tag} |"
              all_rows.append(row_str)
              repo_groups[repo_name].append(row_str)

          def format_grouped_list(data_dict):
              if not data_dict:
                  return "Yok"
              lines = []
              for repo in sorted(data_dict.keys()):
                  plugins_joined = ", ".join([f"`{n}`" for n in sorted(data_dict[repo])])
                  lines.append(f"  * **{repo}:** {plugins_joined}")
              return "\n" + "\n".join(lines)

          if today_news_dict or today_updates_dict:
              news_formatted = format_grouped_list(today_news_dict)
              updates_formatted = format_grouped_list(today_updates_dict)
              daily_summary = (
                  f"> 🚀 **Bugünkü Güncelleme Özeti ({today_str})**\n>\n"
                  f"> * 🆕 **Yeni Eklenenler:**{news_formatted}\n>\n"
                  f"> * 🔴 **Güncellenenler:**{updates_formatted}\n\n"
              )
          else:
              daily_summary = (
                  f"> 📌 **Bugünkü Güncelleme Özeti ({today_str})**: Bugün yeni eklenen veya güncellenen eklenti bulunmuyor.\n\n"
              )

          stats_line = "🆕 Yeni Eklentiler: " + str(new_count) + " &nbsp;|&nbsp; 🔴 Güncellenenler: " + str(updated_count)

          header = (
              f"### Son Güncelleme: {full_date}\n\n"
              f"### Toplam Eklenti: `{len(plugins)}`\n\n"
              f"{daily_summary}"
              f"### 📊 Son 15 Günlük Durum Özeti\n"
              f"{stats_line}\n\n"
              f"---\n### Depo Sahibi:\n"
              f"[<img src='{OWNER_AVATAR}' width='48' style='border-radius:50%;'>]({OWNER_PROFILE})  \n"
              f"**[{OWNER}]({OWNER_PROFILE})**\n\n"
              f"---\n## 📦 Eklenti Listesi\n\n"
              f"*Aşağıdaki gruplara tıklayarak eklentileri listeleyebilirsiniz:*\n\n"
          )

          content_blocks = []

          all_table_str = (
              "| İkon | Eklenti Adı | Tarih | Durum | Kaynak | Ülke |\n"
              "|:----:|:------------|:------|:------|:-------|:----:|\n"
              + "\n".join(all_rows)
          )
          all_block = (
              f"<details>\n"
              f"<summary>🌐 <b>TÜM EKLENTİLER (HEPSİ)</b> ({len(all_rows)} Eklenti)</summary>\n\n"
              f"{all_table_str}\n\n"
              f"</details>\n"
          )
          content_blocks.append(all_block)

          for repo_name in sorted(repo_groups.keys()):
              rows = repo_groups[repo_name]
              table_str = (
                  "| İkon | Eklenti Adı | Tarih | Durum | Kaynak | Ülke |\n"
                  "|:----:|:------------|:------|:------|:-------|:----:|\n"
                  + "\n".join(rows)
              )
              block = (
                  f"<details>\n"
                  f"<summary>📂 <b>{repo_name}</b> ({len(rows)} Eklenti)</summary>\n\n"
                  f"{table_str}\n\n"
                  f"</details>\n"
              )
              content_blocks.append(block)

          Path("README.md").write_text(header + "\n".join(content_blocks), encoding="utf-8")

      - name: Commit and Push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add plugins.json backup-plugins.json README.md plugins/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: plugins, backup-plugins and README"
            git pull --rebase origin main
            git push https://x-access-token:${GH_TOKEN}@github.com/mooncrown04/depolar.git HEAD:main
          fi
