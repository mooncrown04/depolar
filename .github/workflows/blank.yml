# --- 2. ADIM: README TABLO OLUŞTURUCU (PYTHON) ---
      - name: README.md Guncelle
        shell: python
        run: |
          import json, re
          from datetime import datetime, timedelta, timezone
          from collections import defaultdict
          from pathlib import Path

          OWNER = "MoOnCrOwN"
          OWNER_AVATAR = "https://st5.depositphotos.com/1041725/67731/v/380/depositphotos_677319750-stock-illustration-ararat-mountain-illustration-vector-white.jpg"
          OWNER_PROFILE = "https://github.com/mooncrown04"
          FLAGS = {"tr": "https://flagcdn.com/w20/tr.png", "en": "https://flagcdn.com/w20/gb.png", "de": "https://flagcdn.com/w20/de.png", "us": "https://flagcdn.com/w20/us.png", "hi": "https://flagcdn.com/w20/in.png"}
          
          now = datetime.now(timezone(timedelta(hours=3)))
          today_str = now.strftime("%d.%m.%Y")
          full_date = now.strftime("%d.%m.%Y %H:%M")

          if not Path("plugins.json").exists(): exit(0)
          with open("plugins.json", encoding="utf-8") as f:
              plugins = json.load(f)

          rows = []
          today_news_dict = defaultdict(list)
          today_updates_dict = defaultdict(list)
          new_count = 0
          updated_count = 0

          for p in sorted(plugins, key=lambda x: x.get('name','').lower()):
              name = p.get('name','Unknown')
              desc = p.get('description', '')
              date_match = re.search(r'\d{2}\.\d{2}\.\d{4}', desc)
              date_str = date_match.group(0) if date_match else "—"
              
              owner_match = re.search(r'(?:🆕 |🔴 )(.*?) \d', desc)
              repo_name = owner_match.group(1) if owner_match else "Bilinmiyor"
              
              marker = "⚪"
              if date_match:
                  try:
                      item_date = datetime.strptime(date_str, "%d.%m.%Y").replace(tzinfo=now.tzinfo)
                      
                      if date_str == today_str:
                          if "🆕" in desc:
                              today_news_dict[repo_name].append(name)
                          elif "🔴" in desc:
                              today_updates_dict[repo_name].append(name)

                      if (now - item_date).days <= 60:
                          if "🔴" in desc: 
                              marker = "🔴"
                              updated_count += 1
                          elif "🆕" in desc: 
                              marker = "🆕"
                              new_count += 1
                  except: pass
              
              lang_val = str(p.get("language") or p.get("lang") or "tr").lower().split('-')[0]
              flag_url = FLAGS.get(lang_val, "https://flagcdn.com/w20/un.png")
              country_tag = f'<img src="{flag_url}" width="20" alt="{lang_val}">'
              icon = p.get("iconUrl") or p.get("icon") or ""
              img_tag = f'<img src="{icon}" width="30" style="border-radius:4px;">' if icon and "%size%" not in icon else "—"
              rows.append(f"| {img_tag} | **{name}** | {date_str} | {marker} | `{repo_name}` | {country_tag} |")

          def format_grouped_list(data_dict):
              if not data_dict:
                  return "Yok"
              lines = []
              for repo in sorted(data_dict.keys()):
                  plugins_joined = ", ".join([f"`{n}`" for n in sorted(data_dict[repo])])
                  lines.append(f"  * **{repo}:** {plugins_joined}")
              return "\n" + "\n".join(lines)

          if today_news_dict or today_updates_dict:
              news_formatted = format_grouped_list(today_news_dict)
              updates_formatted = format_grouped_list(today_updates_dict)
              daily_summary = (
                  f"> 🚀 **Bugünkü Güncelleme Özeti ({today_str})**\n>\n"
                  f"> * 🆕 **Yeni Eklenenler:**{news_formatted}\n>\n"
                  f"> * 🔴 **Güncellenenler:**{updates_formatted}\n\n"
              )
          else:
              daily_summary = (
                  f"> 📌 **Bugünkü Güncelleme Özeti ({today_str})**: Bugün yeni eklenen veya güncellenen eklenti bulunmuyor.\n\n"
              )

          header = (
              f"### Son Güncelleme: {full_date}\n\n"
              f"### Toplam Eklenti: `{len(plugins)}`\n\n"
              f"{daily_summary}"
              f"### 📊 Son 60 Günlük Durum Özeti\n"
              f"🆕 Yeni Eklentiler: `{new_count}` | 🔴 Güncellenenler: `{updated_count}`\n\n"
              f"---\n### Depo Sahibi:\n"
              f"[<img src='{OWNER_AVATAR}' width='48' style='border-radius:50%;'>]({OWNER_PROFILE})  \n"
              f"**[{OWNER}]({OWNER_PROFILE})**\n\n"
              f"---\n## 📦 Eklenti Listesi\n\n"
              f"| İkon | Eklenti Adı | Tarih | Durum | Kaynak | Ülke |\n"
              f"|:----:|:------------|:------|:------|:-------|:----:|\n"
          )
          Path("README.md").write_text(header + "\n".join(rows), encoding="utf-8")
